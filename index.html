
<style>

.csb-root{
  --brass:#2563EB;
  --brass-bright:#3B82F6;
  --brass-dim:rgba(37,99,235,0.10);
  --ink:#14171C;
  --ink-2:#1D2129;
  --ink-line:rgba(255,255,255,0.09);

  --color-background-primary:#FFFFFF;
  --color-background-secondary:#F5F6F8;
  --color-background-success:#F0FDF4;
  --color-background-warning:#FFF8EA;
  --color-background-danger:#FEF2F2;
  --color-background-info:#EFF6FF;

  --color-text-primary:#14171C;
  --color-text-secondary:#3A4150;
  --color-text-tertiary:#6B7280;
  --color-text-success:#166534;
  --color-text-warning:#92661C;
  --color-text-danger:#B91C1C;
  --color-text-info:#1D4ED8;

  --color-border-primary:#2563EB;
  --color-border-secondary:#E2E5EA;
  --color-border-tertiary:#EDEFF3;
  --color-border-success:#BBF7D0;
  --color-border-warning:#FBE3AE;

  --color-border-info:#BFDBFE;

  --border-radius-lg:14px;
  --font-mono:'JetBrains Mono',monospace;

  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  max-width:1400px;
  margin:0 auto;
  padding:32px 40px 60px;
}
@media (max-width:640px){
  .csb-root{padding:20px 16px 40px;}
}
.csb-root h1,.csb-root h2,.csb-root h3{font-family:'Space Grotesk',sans-serif;}
.csb-root .rt,.csb-root .pan-table{font-family:'Inter',sans-serif;}
.csb-root .bc-num,.csb-root .av .num,.csb-root .sg .num,.csb-root .zone-range,
.csb-root .cp-v,.csb-root .lv,.csb-root .wp,.csb-root .iem-lvl,
.csb-root td:first-child,.csb-root .ch-sub,.csb-root .gap-title{font-family:'JetBrains Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
.csb-root .nav{
  display:flex;gap:6px;flex-wrap:wrap;
  padding:4px 2px;
  background:transparent;
  border-radius:0;
  border:none;
  border-bottom:none;
  margin-bottom:1.85rem;
  box-shadow:none;
}
.csb-root .nb{
  font-family:'Inter',sans-serif;
  font-size:13px;
  font-weight:500;
  letter-spacing:0;
  padding:9px 16px;
  border-radius:10px;
  border:1.5px solid var(--color-border-secondary);
  border-bottom:1.5px solid var(--color-border-secondary);
  background:#FFFFFF;
  color:#374151;
  cursor:pointer;
  transition:all 0.15s;
  white-space:nowrap;
}
.csb-root .nb:hover{color:var(--brass);border-color:var(--brass-bright);background:var(--brass-dim);}
.csb-root .nb.active{
  background:#FFFFFF;
  color:var(--brass);
  border-color:var(--brass);
  border-bottom-color:var(--brass);
  font-weight:700;
  box-shadow:0 0 0 1px var(--brass);
}
.csb-root .sl{
  font-family:'Inter',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
  color:#9096A2;
  margin:1.85rem 0 12px;
  padding-left:0;
  border-left:none;
  line-height:1.4;
}
.csb-root .sl:first-child{margin-top:0;}
.csb-root .card,.csb-root .bc,.csb-root .ch-card,.csb-root .zone,.csb-root .pan-card{
  border-radius:12px;
  box-shadow:0 1px 2px rgba(20,20,30,0.04);
}
.csb-root .ch-card{border-top-width:3px;}
.csb-root .rt th{font-family:'Inter',sans-serif;letter-spacing:0.05em;}

/* Tables — rounded card treatment matching the reference style */
.csb-root .rt{
  border-collapse:separate;border-spacing:0;
  border:1px solid #E9EAEE;border-radius:12px;overflow:hidden;
  box-shadow:0 1px 2px rgba(20,20,30,0.04);
  margin:0 0 1.35rem;
}
.csb-root .rt th{
  background:#FAFBFC;
  color:#6B7280;font-weight:700;font-size:10px;
  padding:11px 14px;
  border-bottom:1.5px solid #E9EAEE;
}
.csb-root .rt td{
  padding:10px 14px;
  border-bottom:1px solid #F1F2F5;
  font-size:12px;line-height:1.55;
}
.csb-root .rt tr:last-child td{border-bottom:none;}
.csb-root .rt tbody tr:hover td{background-color:rgba(37,99,235,0.035);}
.csb-root .rt td:first-child{font-weight:600;}

/* Step lists — blue numbered markers matching the new primary accent */
.csb-root .step-list{margin:0 0 1.15rem;}
.csb-root .step-list li{
  padding:11px 6px;
  border-bottom:1px solid #F1F2F5;
}
.csb-root .step-list li:last-child{border-bottom:none;}
.csb-root .sn{
  width:23px;height:23px;
  background:var(--brass-dim);
  border:1.5px solid var(--brass);
  color:var(--brass);font-weight:700;
  font-family:'Inter',sans-serif;font-size:10.5px;
  box-shadow:0 1px 2px rgba(37,99,235,0.12);
}
</style>

<style>

.gap-detail{font-size:12px;color:var(--color-text-secondary);line-height:1.7;}
.gap-detail strong{color:var(--color-text-primary);font-weight:500;}
.gap-action{margin-top:6px;font-size:11px;font-weight:600;color:var(--color-text-primary);padding-left:12px;border-left:2px solid var(--color-border-secondary);}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;}
.tag.crit{background:rgba(239,68,68,0.12);color:var(--color-text-danger);}
.tag.imp{background:rgba(234,179,8,0.12);color:var(--color-text-warning);}
.tag.nice{background:rgba(34,197,94,0.12);color:var(--color-text-success);}
.tag.info{background:rgba(14,165,233,0.12);color:var(--color-text-info);}
.tag.future{background:var(--color-background-secondary);color:var(--color-text-tertiary);border:0.5px solid var(--color-border-secondary);}
.pan-table{width:100%;border-collapse:collapse;font-size:12px;margin:0 0 1rem;}
.pan-table th{text-align:left;font-size:10px;font-weight:600;color:var(--color-text-tertiary);padding:5px 8px;border-bottom:0.5px solid var(--color-border-secondary);text-transform:uppercase;letter-spacing:0.04em;}
.pan-table td{padding:7px 8px;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-secondary);font-size:12px;}
.pan-table td:first-child{color:var(--color-text-primary);font-weight:500;}
.pan-bar-wrap{width:100%;height:8px;background:var(--color-background-secondary);border-radius:4px;position:relative;}
.pan-c{position:absolute;top:0;left:50%;transform:translateX(-50%);height:100%;width:1.5px;background:var(--color-border-secondary);}
.pan-l{position:absolute;top:0;right:50%;height:100%;border-radius:4px 0 0 4px;}
.pan-r{position:absolute;top:0;left:50%;height:100%;border-radius:0 4px 4px 0;}
.pan-dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;}
.pan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0 0 1rem;}
.pan-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px;}
.pan-card-label{font-size:11px;color:var(--color-text-tertiary);margin:0 0 4px;}
.pan-card-row{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--color-text-secondary);}
/* --- merged from AUX/IEM deep-dive --- */
.nb{font-size:11px;padding:4px 10px;border-radius:99px;border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);cursor:pointer;white-space:nowrap;}
.step-list li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px;color:var(--color-text-secondary);line-height:1.6;}
.sn{width:22px;height:22px;border-radius:50%;background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--color-text-secondary);flex-shrink:0;margin-top:1px;}

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const isDark=matchMedia('(prefers-color-scheme:dark)').matches;
const gc=isDark?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.07)';
const zc=isDark?'rgba(255,255,255,0.2)':'rgba(0,0,0,0.18)';
const tc=isDark?'#9b9a96':'#888780';
const FREQS=[20,31,50,80,125,200,315,500,800,1250,2000,3150,5000,8000,12500,16000,20000];
const FL=['20','','50','80','125','200','','500','','1.25k','2k','3k','5k','8k','','16k','20k'];
function hpf(fc,f){return f.map(x=>{if(x>=fc)return 0;return Math.max(-12,40*Math.log10(x/fc));});}
function peak(fc,g,q,f){return f.map(x=>{const w=x/fc,bw=w/q;return g/(1+Math.pow((w*w-1)/(w*bw),2)+0.0001);});}
function shelf(fc,g,dir,f){return f.map(x=>{const r=dir==='low'?fc/x:x/fc;if(r<0.5)return g;if(r>2)return 0;return g*(2-r*2);});}
function sum(c){return FREQS.map((_,i)=>c.reduce((s,x)=>s+(x[i]||0),0));}
const drawn={};
const bandMeta={};
function freqToFracIndex(f){
  const logF=Math.log10(f);
  for(let i=0;i<FREQS.length-1;i++){
    const a=Math.log10(FREQS[i]),b=Math.log10(FREQS[i+1]);
    if(logF>=a&&logF<=b)return i+(logF-a)/(b-a);
  }
  return logF<Math.log10(FREQS[0])?0:FREQS.length-1;
}
function curveValueAt(f,bands){
  let v=0;
  bands.forEach(b=>{
    if(b.t==='h')v+=hpf(b.f,[f])[0];
    else if(b.t==='p')v+=peak(b.f,b.g,b.q||1.5,[f])[0];
    else if(b.t==='s')v+=shelf(b.f,b.g,b.d||'high',[f])[0];
  });
  return Math.max(-12,Math.min(9,v));
}
let pluginRegistered=false;
function posLabelFor(i,total){
  if(i===0)return'L';
  if(i===total-1)return'H';
  return String(i);
}
function registerEqBandPlugin(){
  if(pluginRegistered)return;
  pluginRegistered=true;
  Chart.register({
    id:'eqBandMarkers',
    afterDraw(chart){
      const meta=bandMeta[chart.canvas.id];
      if(!meta)return;
      const{bands,color}=meta;
      const ctx=chart.ctx,xScale=chart.scales.x,yScale=chart.scales.y;
      const top=chart.chartArea.top,bottom=chart.chartArea.bottom;
      const mid=(top+bottom)/2;
      ctx.save();
      bands.forEach((b,i)=>{
        const pos=posLabelFor(i,bands.length);
        const inactive=b.t==='p'&&(!b.g||b.g===0);
        const decimal=freqToFracIndex(b.f)/(FREQS.length-1);
        const x=xScale.getPixelForDecimal(decimal);
        const yVal=curveValueAt(b.f,bands);
        const y=yScale.getPixelForValue(yVal);
        ctx.beginPath();
        ctx.strokeStyle=color;
        ctx.globalAlpha=inactive?0.25:0.5;
        ctx.lineWidth=1.4;
        ctx.setLineDash(b.t==='h'?[4,3]:[]);
        ctx.moveTo(x,top);ctx.lineTo(x,bottom);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha=inactive?0.55:1;
        ctx.beginPath();
        ctx.fillStyle=color;
        ctx.arc(x,y,inactive?3.5:4.5,0,Math.PI*2);
        ctx.fill();
        ctx.lineWidth=2;ctx.strokeStyle=isDark?'#1a1a1a':'#fff';
        ctx.stroke();
        ctx.globalAlpha=1;
        // position tag (L/1/2/3/4/H) in a small pill above/below the marker
        const above=y>mid;
        const tagY=above?Math.max(top+14,y-13):Math.min(bottom-22,y+21);
        ctx.font='700 13px sans-serif';
        ctx.textAlign='center';
        ctx.fillStyle=inactive?tc:color;
        ctx.fillText(pos,x,tagY);
        if(!inactive){
          const valLabel=b.t==='h'?'HPF':(b.g>0?'+'+b.g+'dB':b.g+'dB');
          ctx.font='600 10px sans-serif';
          ctx.fillStyle=tc;
          ctx.fillText(valLabel+' · '+eqFreqLabel(b.f),x,above?Math.min(bottom-4,tagY+15):Math.max(top+9,tagY-15));
        }
      });
      ctx.restore();
    }
  });
}
function drawEQ(id,color,bands){
  if(drawn[id])return;
  const el=document.getElementById(id);if(!el)return;
  registerEqBandPlugin();
  bandMeta[id]={bands,color};
  const curves=bands.map(b=>{
    if(b.t==='h')return hpf(b.f,FREQS);
    if(b.t==='p')return peak(b.f,b.g,b.q||1.5,FREQS);
    if(b.t==='s')return shelf(b.f,b.g,b.d||'high',FREQS);
    return FREQS.map(()=>0);
  });
  const total=sum(curves).map(v=>Math.max(-12,Math.min(9,v)));
  const fa=isDark?color.replace(')',',0.18)').replace('rgb','rgba'):color.replace(')',',0.15)').replace('rgb','rgba');
  const fb=isDark?color.replace(')',',0.08)').replace('rgb','rgba'):color.replace(')',',0.06)').replace('rgb','rgba');
  drawn[id]=new Chart(el,{type:'line',data:{labels:FL,datasets:[{data:total,borderColor:color,borderWidth:2,pointRadius:0,fill:{target:'origin',above:fa,below:fb},tension:0.45}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{grid:{color:gc},ticks:{color:tc,font:{size:10},maxRotation:0,autoSkip:false}},y:{min:-12,max:9,grid:{color:c=>c.tick.value===0?zc:gc},ticks:{color:tc,font:{size:10},stepSize:3,callback:v=>v===0?'0':v>0?'+'+v:v}}}}});
}
function eqFreqLabel(f){
  return f>=1000?(f%1000===0?(f/1000)+'kHz':(f/1000).toFixed(1)+'kHz'):f+'Hz';
}

function eqValuesCard(bands){
  const rows=bands.map((b,i)=>{
    const pos=posLabelFor(i,bands.length);
    const freq=eqFreqLabel(b.f);
    const inactive=b.t==='p'&&(!b.g||b.g===0);
    const gain=b.t==='h'?'HPF':(inactive?'flat':(b.g>0?'+':'')+b.g+'dB');
    const q=(b.t==='p'&&!inactive)?' · Q'+(b.q||1.5):'';
    return`<div class="cp"><div class="cp-l">${pos} · ${freq}</div><div class="cp-v">${gain}${q}</div></div>`;
  }).join('');
  return`<div class="comp-label">EQ values (L / 1–4 / H)</div><div class="comp-row">${rows}</div>`;
}
function cpCard(r,thr,atk,hold,rel,knee,gr){
  const pct=Math.min(100,(gr/8)*100);
  const col=gr<=3?'#1D9E75':gr<=6?'#BA7517':'#A32D2D';
  return `<div class="comp-label">Compression</div><div class="comp-row">
    <div class="cp"><div class="cp-l">Ratio</div><div class="cp-v">${r}</div></div>
    <div class="cp"><div class="cp-l">Threshold</div><div class="cp-v">${thr}</div></div>
    <div class="cp"><div class="cp-l">Attack</div><div class="cp-v">${atk}</div></div>
    <div class="cp"><div class="cp-l">Hold</div><div class="cp-v">${hold}</div></div>
    <div class="cp"><div class="cp-l">Release</div><div class="cp-v">${rel}</div></div>
    <div class="cp"><div class="cp-l">Knee (1–5)</div><div class="cp-v">${knee}</div></div>
    <div class="cp"><div class="cp-l">GR target</div><div class="cp-v">${gr} dB</div></div>
  </div><div class="gr-bar"><div class="gr-fill" style="width:${pct.toFixed(0)}%;background:${col}"></div></div>`;
}
function gateCard(on,params){
  if(!on)return`<div class="gate-wrap"><span class="gate-badge off">Gate OFF</span><div style="font-size:11px;color:var(--color-text-tertiary)">Not needed</div></div>`;
  const rows=(params||[]).map(p=>`<div class="cp"><div class="cp-l">${p[0]}</div><div class="cp-v">${p[1]}</div></div>`).join('');
  return`<div class="gate-wrap"><span class="gate-badge on">Gate ON</span><div class="gate-row">${rows}</div></div>`;
}
function mkCard(id,title,sub,ac,color,bands,comp,gate){
  return`<div class="ch-card" style="--ac:${ac}">
    <div class="ch-title">${title}</div><div class="ch-sub">${sub}</div>
    <div class="eq-label">EQ curve</div>
    <div class="eq-wrap"><canvas id="${id}" style="width:100%;height:100%"></canvas></div>
    ${eqValuesCard(bands)}
    ${cpCard(...comp)}${gateCard(gate[0],gate[1])}
  </div>`;
}

{id:'concept',label:'📖 The concept',html:`
<div class="danger"><strong>Update: IEM has moved off the AUX buses entirely.</strong> AUX 1–8 are now fully free. The 4 monitor mixes live on spare MIX buses instead (B9, B10, B11, B13), fed via Bus→Bus sends from the FOH buses — the same "BUS → BUS" screen visible on your WING CONFIG page.</div>

<div class="sl">The actual signal path — using the Drums bus as the example</div>
<div class="flow-row"><span class="fp hi">Drums bus (B5–6)</span></div>
<div class="sl" style="margin-top:1rem">Path 1 — to the room (FOH)</div>
<div class="flow-row"><span class="fp ok">Drums bus (B5–6)</span><span class="fa">→</span><span class="fp ok">Main LR</span><span class="fa">→</span><span class="fp" style="background:#FEF3C7;color:#92400E">RCF speakers</span></div>
<div class="sl" style="margin-top:1rem">Path 2 — to musicians' ears (IEM)</div>
<div class="flow-row"><span class="fp sd">Drums bus → Bus→Bus send</span><span class="fa">→</span><span class="fp sd">B9 · IEM Drummer bus</span><span class="fa">→</span><span class="fp sd">AES50 Out 2 → SD16 Out 2 → P2 #1</span></div>

<div class="success"><strong>Both paths start from the same bus at the same time, fully independently.</strong> The Drums bus's own fader only controls the FOH path — its send into B9 is a separate control that doesn't move when the FOH fader does.</div>

<div class="card"><div class="card-title">Select the destination bus, not an AUX</div>
<div class="card-body">CONFIG → the <span class="wp">BUS → BUS</span> screen → set the destination field to <strong>B9</strong> (IEM Drummer) → every one of the 16 buses appears as a row with its own send button into B9. Find the Drums bus row and set its level — done once for the whole kit.</div></div>

<div class="card"><div class="card-title">Why move off AUX</div>
<div class="card-body">Regular mix buses get the exact same processing (EQ, dynamics, limiter) as any FOH bus, so nothing is lost by using them for monitor mixes. It also frees all 8 AUX buses for other future uses, and keeps everything — FOH buses and monitor buses alike — inside the one workflow you already use daily (CONFIG → BUS/MAIN → BUS → BUS).</div></div>

<div class="card"><div class="card-title">Click track is no longer an exception</div>
<div class="card-body">Click (IN37) still never touches Main LR. But since B9, B10, B11, and B13 are ordinary mix buses, Click now reaches the drummer's mix with a completely normal <strong>channel → bus send</strong>, the same mechanism every channel already uses to reach any bus — set directly from Click's own channel strip, no special case required.</div></div>

<div class="card"><div class="card-title">Lead vocal has a channel limiter now</div>
<div class="card-body">Lead vocal (IN1) feeds all 4 IEM buses directly, so it's the one direct-send source that genuinely needed extra protection. A –6dBFS limiter now sits on IN1's own channel strip — before Main LR, Matrix, and all 4 IEM sends split off, so one setting protects everyone at once. It stacks with each IEM bus's own –6dB limiter: if the lead vocalist spikes, IN1's limiter catches it first, without ducking the whole IEM mix (drums, click, everything else on that bus) the way a bus-level limiter reacting on its own would.</div></div>

<div class="danger"><strong>Channel sends and bus sends work differently on WING — confirmed directly from the console, not assumed.</strong> A <strong>Bus→Bus</strong> send (e.g. Drums bus into B9) gives you a simple <strong>PRE</strong> button — on or off, fixed before that bus's own fader. A <strong>Channel→Bus</strong> send (e.g. Click, Lead vocal, TALK A/B straight into an IEM bus) works differently: instead of PRE, you get a <strong>TAP / POST / GROUP</strong> mode selector, and "TAP" pulls from that channel's own movable <strong>TAP POINT</strong> — a position you set inside that channel's own processing chain (Gate → EQ → Comp → <em>TAP POINT</em> → Fader). Use <strong>TAP</strong>, not POST, for every direct channel exception in this system — and make sure each one's TAP POINT sits <em>after</em> Comp but <em>before</em> the Fader, so the IEM gets the fully processed signal without following that channel's FOH fader moves.</div>

<div class="sl">Your 4 IEM mix buses</div>
<div class="aux-visual" style="grid-template-columns:repeat(4,1fr)">
<div class="av iem-s"><div class="num">B9</div><div class="name">Drummer</div><div class="sub">P2 #1 · SD16 Out 2</div></div>
<div class="av iem-s"><div class="num">B10</div><div class="name">Bass</div><div class="sub">P2 #2 · SD16 Out 3</div></div>
<div class="av iem-s"><div class="num">B11–12</div><div class="name">Keys 1</div><div class="sub">P1 #3 · SD16 Out 4/5 · stereo, active</div></div>
<div class="av iem-s"><div class="num">B13</div><div class="name">Keys 2</div><div class="sub">P2 #4 · SD16 Out 6</div></div>
</div>
<div class="danger"><strong>Keys 1 deliberately uses a P1, not a P2 — hardware has to match the signal, not just be "a beltpack."</strong> Powerplay P2 has a single XLR/TRS combo input; getting true stereo into it needs a special dual-mono-to-stereo summing cable and its internal mono/stereo switch set correctly. Powerplay P1 has two genuine separate XLR inputs — plug SD16 Out 4 (Keys 1 L) and Out 5 (Keys 1 R) straight in, no workaround cable needed. Since Keys 1 genuinely has two independent outputs feeding it, P1 is the clean hardware match. Drummer, Bass, and Keys 2 stay on P2 — they're mono, so P2's single input and smaller size are the better fit there. If Keys 2 ever goes stereo too, it should move to a P1 for the same reason.</div>

<div class="tip"><strong>Bus capacity:</strong> WING has 16 mix buses total. FOH now uses 9 (B1–2 BV, B3–4 Band, B5–6 Drums, B7 Horns, B8 Speech, B16 Reverb send) — Lead vocal and Choir no longer tie up buses, they route straight to Main + Matrix from the channel. IEM uses 5 (B9 Drummer, B10 Bass, B11–12 Keys 1 stereo, B13 Keys 2). That leaves <strong>2 genuine spare (B14, B15)</strong> — both isolated, so neither can become a stereo pair without freeing a neighbour too.</div>

<div class="sl">The settings that make IEM work correctly</div>
<table class="rt">
<tr><th>Setting</th><th>Applies to</th><th>Why it matters</th></tr>
<tr><td><strong>PRE</strong></td><td>Bus→Bus sends — Drums, BV, Band, Horns, Keys buses feeding an IEM bus</td><td>Reads the source bus BEFORE its own fader. If left on POST, pulling down the Backing vocals bus fader for the room also pulls it down in every musician's ears. Confirmed on the console: this is a straightforward PRE toggle for bus-to-bus.</td></tr>
<tr><td><strong>TAP</strong> (with TAP POINT after Comp)</td><td>Channel→Bus direct sends — Click, Lead vocal, Choir, TALK A/B</td><td>These channels have no bus of their own, so there's no simple PRE button — WING gives TAP/POST/GROUP instead. TAP POINT set after Comp (before Fader) means the IEM gets the same processed sound as the room, just without following that channel's fader.</td></tr>
<tr><td><strong>Independent send level per source</strong></td><td>Both</td><td>The Drums bus can be loud into B9 (drummer), quieter into B11 (keys 1) — same source, different level into each IEM bus.</td></tr>
<tr><td><strong>Limiter on each IEM bus's output</strong></td><td>Both</td><td>In-ears sit in the ear canal. A limiter at –6dB on B9/10/11–12/13 protects against any sudden spike from a fader mistake, on top of whatever's feeding it.</td></tr>
</table>`
},
{id:'wing_setup',label:'⚙️ WING setup steps',html:`
<div class="sl">Step-by-step: setting up one IEM mix bus correctly</div>
<ul class="step-list">
<li><div class="sn">1</div><div class="at">CONFIG → BUS/MAIN → select <strong>B9</strong> → <strong>RENAME</strong> to "IEM Drummer" (repeat later for B10/B11/B13)</div></li>
<li><div class="sn">2</div><div class="at">CONFIG → <strong>BUS → BUS SENDS</strong> screen → set the destination field to <span class="wp">B9</span></div></li>
<li><div class="sn">3</div><div class="at">Every bus (B1–B16) now appears as a row. Find the <strong>Drums bus (B5–6)</strong> row and set its send level into B9</div></li>
<li><div class="sn">4</div><div class="at">Confirm that send shows <strong>PRE</strong> (not POST) — for bus-to-bus, WING gives you a simple PRE/POST toggle, fixed before that bus's own fader</div></li>
<li><div class="sn">5</div><div class="at">Repeat steps 3–4 for every other bus that should appear in the drummer's mix — Backing vocals (B1–2), Band (B3–4)</div></li>
<li><div class="sn">5b</div><div class="at">Select the <strong>Lead vocal channel (IN1)</strong> → its own channel screen shows <strong>BUS SENDS</strong> with a <strong>TAP / POST</strong> toggle per bus (not PRE — channels work differently to buses, see the concept tab). Set B9's mode to <strong>TAP</strong>, not POST, and dial in the send level</div></li>
<li><div class="sn">5c</div><div class="at">On that same Lead vocal channel screen, check the <strong>TAP POINT</strong> field at the top — it should read <strong>COMP</strong> (i.e. after the compressor, before the fader). If it's set to anything after the fader, move it back — this is what actually makes TAP behave as pre-fader</div></li>
<li><div class="sn">6</div><div class="at">Select the <strong>Click channel</strong> → same pattern: <strong>TAP</strong> mode (not POST) on B9's send, TAP POINT confirmed at <strong>COMP</strong></div></li>
<li><div class="sn">7</div><div class="at">Select bus B9 → CONFIG → <strong>DYNAMICS → Limiter</strong> → ON → ceiling –6 dBFS</div></li>
<li><div class="sn">8</div><div class="at">Select bus B9 → CONFIG → <strong>ROUTING</strong> → assign AES50 Out 2 → carries to SD16 Out 2 → P2 #1</div></li>
<li><div class="sn">9</div><div class="at">Repeat steps 1–8 for B10 (Bass · AES50 Out 3), B11 (Keys 1 · AES50 Out 4), B13 (Keys 2 · AES50 Out 6)</div></li>
<li><div class="sn">9b</div><div class="at">Stereo-link B11 and B12 on WING (CONFIG → BUS/MAIN → select both → link as stereo pair) — Keys 1's monitor mix is active in stereo now, mirror every send from B11 onto B12 automatically once linked</div></li>
<li><div class="sn">9c</div><div class="at">Select the <strong>TALK A / engineer channel (IN13)</strong> → set <strong>TAP</strong> mode (not POST) on all 4 IEM bus sends (B9, B10, B11, B13) at a cue level, and confirm IN13's TAP POINT is after Comp — this is separate from TALK A's existing stage-speaker output, so musicians on P2 hear it even though they're acoustically sealed off from the room</div></li>
<li><div class="sn">9d</div><div class="at">Select the <strong>TALK B channel (IN38)</strong> → <strong>TAP</strong> mode on B9, B10, and B13 (not B11 — that's Keys MD's own mix), TAP POINT after Comp, plus route to the console's own Control Room/Monitor bus (PHONES/SPEAKERS) so the engineer hears it too — not the shared stage speaker</div></li>
<li><div class="sn">9e</div><div class="at">Select <strong>Lead vocal (IN1)</strong> → channel DYNAMICS → add a second stage: <strong>Limiter ON, ceiling –6dBFS</strong>, fast attack — this sits before Main LR/Matrix/all 4 IEM sends split off, so it protects everything downstream in one place</div></li>
<li><div class="sn">9f</div><div class="at">Select <strong>Choir (IN8)</strong> → <strong>TAP</strong> mode (not POST) on B11 (Keys 1) and B13 (Keys 2) only, around –8dB, TAP POINT after Comp — same treatment as the Backing vocals bus at those two mixes</div></li>
<li><div class="sn">9g</div><div class="at"><strong>Quick reference — don't mix these up:</strong> Bus feeding an IEM bus (Drums, BVs, Band, Horns, Keys) = <strong>PRE</strong>. Individual channel feeding an IEM bus directly (Click, Lead vocal, Choir, TALK A/B) = <strong>TAP</strong>, with that channel's TAP POINT set after Comp. Never POST, on either one.</div></li>
<li><div class="sn">10</div><div class="at">Test: with each musician wearing their P2, pull a source bus's FOH fader to zero. Their IEM mix must not change. If it does, that bus's send into the IEM bus is wrongly set to POST — fix it</div></li>
<li><div class="sn">11</div><div class="at">Test talkback: press TALK A and confirm it's audible in all 4 P2 units, not just the stage speaker</div></li>
</ul>
<div class="tip"><strong>Keys 1 is stereo now, live.</strong> B11 (L) and B12 (R) both feed P1 #3, via SD16 Out 4 and Out 5. Keys 2 is on SD16 Out 6. Drummer and Bass stay mono. B14 and B15 are the two genuine spares left.</div>

<div class="sl">Where to find this on WING</div>
<table class="rt">
<tr><th>Task</th><th>WING navigation</th></tr>
<tr><td>Rename a spare bus for IEM use</td><td>CONFIG → BUS/MAIN → select bus → RENAME</td></tr>
<tr><td>Route one bus's send into another bus</td><td>CONFIG → <span class="wp">BUS → BUS</span> → set destination bus → adjust the source bus's row</td></tr>
<tr><td>Send the click track into an IEM bus</td><td>Select Click's channel → channel SENDS/assign → target bus → set level</td></tr>
<tr><td>Route an IEM bus's output</td><td>CONFIG → select the IEM bus → <span class="wp">ROUTING</span> → AES50 Out 2–6</td></tr>
<tr><td>Set an IEM bus's limiter</td><td>CONFIG → select the IEM bus → <span class="wp">DYNAMICS</span> → Limiter → ON → –6dBFS</td></tr>
<tr><td>See every send into one IEM bus at once</td><td>CONFIG → BUS → BUS → select that bus as destination → shows every source bus in one screen</td></tr>
</table>`
},
{id:'drummer',label:'🥁 B9 Drummer IEM',html:`
<div class="sl">B9 — Drummer's IEM mix</div>
<div class="iem-mix">
<div class="iem-title">Each row below = a source bus's own send into B9 · all PRE-fader · Limiter –6dB on B9 · → AES50 Out 2 → SD16 Out 2 → P2 #1</div>
<div class="iem-row"><span class="iem-src">Click track (IN37) → normal channel send direct to B9</span><span class="iem-lvl" style="color:#1D9E75">0 dB — primary</span></div>
<div class="iem-row"><span class="iem-src">TALK A — Engineer (IN13) → direct channel send into B9</span><span class="iem-lvl" style="color:#1D9E75">Cue level — cuts through when active</span></div>
<div class="iem-row"><span class="iem-src">TALK B — Keys MD (IN38) → direct channel send into B9</span><span class="iem-lvl" style="color:#1D9E75">Cue level — MD talking to the band</span></div>
<div class="iem-row"><span class="iem-src">Drums bus (B5–6) → send into B9</span><span class="iem-lvl" style="color:#1D9E75">–3 dB — high</span></div>
<div class="iem-row"><span class="iem-src">Bass bus → send into B9</span><span class="iem-lvl" style="color:#BA7517">–6 dB — medium</span></div>
<div class="iem-row"><span class="iem-src">Lead vocal (IN1, –6dBFS limiter) → direct channel send into B9</span><span class="iem-lvl" style="color:#BA7517">–9 dB — cues only</span></div>
<div class="iem-row"><span class="iem-src">Keys 1 bus + Keys 2 bus → send into B9</span><span class="iem-lvl">–12 dB — low</span></div>
<div class="iem-row"><span class="iem-src">Room music / stems</span><span class="iem-lvl" style="color:#A32D2D">No send into B9 at all</span></div>
</div>
<div class="tip">Kick and snare still arrive together as one Drums bus send — they're not separately adjustable in the drummer's ears. If the drummer needs kick louder than snare just for themselves, that one channel would need its own direct channel→B9 send, same as click.</div>
<div class="card"><div class="card-title">Why this balance</div>
<div class="card-body">The drummer sets tempo for everyone — click dominates. The drums bus is present for self-monitoring. Bass is medium so the rhythm section locks together. Lead vocal is quiet — just enough for section cues. Keys is barely there for harmonic context only.</div></div>`
},
{id:'bass',label:'🎸 B10 Bass IEM',html:`
<div class="sl">B10 — Bass player's IEM mix</div>
<div class="iem-mix">
<div class="iem-title">Each row = a source bus's own send into B10 · all PRE-fader · Limiter –6dB · → AES50 Out 3 → SD16 Out 3 → P2 #2</div>
<div class="iem-row"><span class="iem-src">Bass bus (own instrument) → send into B10</span><span class="iem-lvl" style="color:#1D9E75">0 dB — own instrument</span></div>
<div class="iem-row"><span class="iem-src">TALK A — Engineer (IN13) → direct channel send into B10</span><span class="iem-lvl" style="color:#1D9E75">Cue level — cuts through when active</span></div>
<div class="iem-row"><span class="iem-src">TALK B — Keys MD (IN38) → direct channel send into B10</span><span class="iem-lvl" style="color:#1D9E75">Cue level — MD talking to the band</span></div>
<div class="iem-row"><span class="iem-src">Drums bus (B5–6) → send into B10</span><span class="iem-lvl" style="color:#1D9E75">–3 dB — groove lock</span></div>
<div class="iem-row"><span class="iem-src">Lead vocal (IN1, –6dBFS limiter) → direct channel send into B10</span><span class="iem-lvl" style="color:#BA7517">–6 dB — medium</span></div>
<div class="iem-row"><span class="iem-src">Keys 1 bus + Keys 2 bus → send into B10</span><span class="iem-lvl">–9 dB — low</span></div>
<div class="iem-row"><span class="iem-src">Click track (IN37)</span><span class="iem-lvl" style="color:#A32D2D">No send into B10 — drummer's reference only</span></div>

<div class="card"><div class="card-title">Why this balance</div>
<div class="card-body">Bass and drums form the rhythmic foundation — both clearly audible so the bassist can lock note timing precisely with the kit. Click deliberately has no send into B10 — the bassist follows the drummer's feel, keeping one single timing reference for the whole band rather than two competing ones.</div></div>`

{id:'keys1',label:'🎹 B11–12 Keys 1 IEM',html:`

<div class="iem-row"><span class="iem-src">Choir (IN8) → direct channel send into B11 + B12</span><span class="iem-lvl">–8 dB — low, only active on choir songs</span></div>
<div class="iem-row"><span class="iem-src">Horns bus → send into B11 + B12</span><span class="iem-lvl">–10 dB — low</span></div>
<div class="iem-row"><span class="iem-src">Click track (IN37)</span><span class="iem-lvl" style="color:#A32D2D">No send into B11/B12 — drummer's reference only</span></div>
</div>
<div class="tip">TALK B (Keys MD's own mic, IN38) isn't sent into B11/B12 — Keys 1 is Keys MD, so that would just feed their own voice back into their own ears. It goes to the other 3 IEM mixes instead — see Drummer, Bass, and Keys 2's tabs.</div>
<div class="card"><div class="card-title">Stereo-link B11 and B12 on WING</div>
<div class="card-body">CONFIG → BUS/MAIN → select B11 and B12 → link as a stereo pair, so a single set of sends and a single fader move controls both — you shouldn't need to set every send twice by hand going forward. Since every source here is naturally mono (mic-level sources), both L and R carry the identical signal at identical levels — this stereo pair isn't creating width from the sources themselves, it's giving Keys 1 a matched pair of outputs so their own P2 unit receives a proper stereo signal rather than a summed mono one.</div></div>
<div class="card"><div class="card-title">Why this balance</div>
<div class="card-body">Keys players generally need the lead vocal louder than other musicians, since they often follow melodic and harmonic cues closely. Keys 2's send is present at reference level so the two keyboard parts don't accidentally double the same register. Choir sits at the same low level as BVs — same reasoning: harmonic/melodic awareness on the songs it's active, silent otherwise. This requires Keys 1 and Keys 2 to sit on separate buses — see the capacity note on the concept tab.</div></div>`
},
{id:'keys2',label:'🎹 B13 Keys 2 IEM',html:`
<div class="sl">B13 — Keys 2's IEM mix</div>
<div class="iem-mix">
<div class="iem-title">Each row = a source bus's own send into B13 · all PRE-fader · Limiter –6dB · → AES50 Out 6 → SD16 Out 6 → P2 #4</div>
<div class="iem-row"><span class="iem-src">Keys 2 bus (own instrument) → send into B13</span><span class="iem-lvl" style="color:#1D9E75">0 dB — own instrument</span></div>
<div class="iem-row"><span class="iem-src">TALK A — Engineer (IN13) → direct channel send into B13</span><span class="iem-lvl" style="color:#1D9E75">Cue level — cuts through when active</span></div>
<div class="iem-row"><span class="iem-src">TALK B — Keys MD (IN38) → direct channel send into B13</span><span class="iem-lvl" style="color:#1D9E75">Cue level — MD talking to the band</span></div>
<div class="iem-row"><span class="iem-src">Lead vocal (IN1, –6dBFS limiter) → direct channel send into B13</span><span class="iem-lvl" style="color:#BA7517">–4 dB — melody lead</span></div>
<div class="iem-row"><span class="iem-src">Keys 1 bus → send into B13</span><span class="iem-lvl">–6 dB — reference</span></div>
<div class="iem-row"><span class="iem-src">Backing vocals bus (B1–2) → send into B13</span><span class="iem-lvl">–8 dB — low</span></div>
<div class="iem-row"><span class="iem-src">Choir (IN8) → direct channel send into B13</span><span class="iem-lvl">–8 dB — low, only active on choir songs</span></div>
<div class="iem-row"><span class="iem-src">Horns bus → send into B13</span><span class="iem-lvl">–10 dB — low</span></div>
<div class="iem-row"><span class="iem-src">Click track (IN37)</span><span class="iem-lvl" style="color:#A32D2D">No send into B13 — drummer's reference only</span></div>
</div>
<div class="card"><div class="card-title">Mirror of Keys 1</div>
<div class="card-body">Keys 2's mix mirrors Keys 1 — each hears their own bus loudest, the other keys bus as reference, same supporting cast at the same low levels. This symmetry makes weekly setup quick and predictable.</div></div>`

{id:'test',label:'✅ Testing + troubleshooting',html:`
<div class="sl">How to verify it's all correct</div>
<ul class="step-list">
<li><div class="sn">1</div><div class="at"><strong>Independence test:</strong> with full band playing and each musician wearing their P2, pull the Backing vocals bus fader to zero. Every musician's IEM should sound unchanged — if the BVs vanish, that bus's send into the IEM bus is wrongly set to POST instead of PRE. Then pull the <strong>Lead vocal channel fader</strong> (not a bus fader — Lead vocal is a direct channel send) and check the same thing. If it changes in the IEM, either its send is set to POST instead of TAP, or its TAP POINT is sitting after the fader instead of after Comp.</div></li>
<li><div class="sn">2</div><div class="at"><strong>Isolation test:</strong> mute the click track with MG4. Only the drummer should react — bass and both keys players have no send from click to begin with.</div></li>
<li><div class="sn">3</div><div class="at"><strong>Limiter test:</strong> with a musician wearing their P2 at safe volume, briefly raise a source bus's fader unrealistically high. The limiter on that IEM bus should prevent any uncomfortable spike. Warn the musician first.</div></li>
<li><div class="sn">4</div><div class="at"><strong>Independent level test:</strong> raise Click's send into B9 while leaving B10/11–12/13 untouched (they should already have no click send at all). Only the drummer notices.</div></li>
</ul>

<div class="sl">Common problems and fixes</div>
<table class="rt">
<tr><th>Problem</th><th>Cause</th><th>Fix</th></tr>
<tr><td>IEM mix changes when FOH fader moves</td><td>That bus's send into the IEM bus is set to POST instead of PRE</td><td>CONFIG → BUS → BUS → select the IEM bus as destination → toggle that source bus's send to PRE</td></tr>
<tr><td>Musician's mix sounds thin or unclear</td><td>Too many buses at equal send level — no clear priority</td><td>Re-establish a clear loudest bus per the tables above</td></tr>
<tr><td>Click heard by other musicians</td><td>Click channel has an accidental send to B10/11–12/13</td><td>Select Click channel → confirm sends to B10/11–12/13 are off, B9 only</td></tr>
<tr><td>Sudden loud spike hurts ears</td><td>No limiter, or ceiling set too high on that IEM bus</td><td>Select the IEM bus → DYNAMICS → confirm limiter ON at –6dBFS</td></tr>
<tr><td>One musician's P2 is silent</td><td>AES50 output routing wrong on that IEM bus, or cable fault</td><td>Confirm that bus's ROUTING → correct AES50 Out number · check XLR from SD16 to that P2</td></tr>
<tr><td>Kick/snare balance wrong for the drummer only</td><td>Both now arrive as a single Drums bus send — can't be split per-musician</td><td>Give that one mic its own direct channel→B9 send, same as click</td></tr>
<tr><td>Sounds right in soundcheck, off live</td><td>Adrenaline changes performance dynamics</td><td>Normal — keep the Bus→Bus sends accessible to nudge during the set</td></tr>
</table>

<div class="danger"><strong>Safety reminder:</strong> In-ear monitors sit directly in the ear canal. A limiter on every IEM bus (B9/10/11–12/13) is not optional — confirm all 4 are engaged before every service.</div>`
}

const nav=document.getElementById('nav');
const groupNavEl=document.getElementById('groupNav');
const views=document.getElementById('views');
let activeGroup=SECTIONS[0].group;
let activeId=SECTIONS[0].id;

SECTIONS.forEach((sec,si)=>{
  const div=document.createElement('div');
  div.className='view'+(sec.id===activeId?' active':'');
  div.id='v-'+sec.id;
  div.innerHTML=buildContent(sec.id);
  views.appendChild(div);
});

function activateTab(sec){
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const btn=document.querySelector('.nb[data-id="'+sec.id+'"]');
  if(btn)btn.classList.add('active');
  const v=document.getElementById('v-'+sec.id);
  v.classList.add('active');
  activeId=sec.id;
  const eqMap={eq_vocals:'vocals',eq_speech:'speech',eq_drums:'drums',eq_band:'band',eq_buses:'buses',eq_room:'room'};
  if(eqMap[sec.id])(CDATA[eqMap[sec.id]]||[]).forEach(ch=>setTimeout(()=>drawEQ('eq-'+ch.id,ch.color,ch.bands),30));
}

function renderSubNav(){
  nav.innerHTML='';
  const inGroup=SECTIONS.filter(s=>s.group===activeGroup);
  inGroup.forEach(sec=>{
    const btn=document.createElement('button');
    btn.className='nb'+(sec.id===activeId?' active':'');
    btn.dataset.id=sec.id;
    btn.textContent=sec.label;
    btn.onclick=()=>activateTab(sec);
    nav.appendChild(btn);
  });
}

function renderGroupNav(){
  groupNavEl.innerHTML='';
  GROUPS.forEach(g=>{
    const btn=document.createElement('button');
    btn.className='gnb'+(g.id===activeGroup?' active':'');
    btn.dataset.g=g.id;
    btn.textContent=g.label;
    btn.onclick=()=>{
      activeGroup=g.id;
      const firstInGroup=SECTIONS.find(s=>s.group===g.id);
      renderGroupNav();
      renderSubNav();
      activateTab(firstInGroup);
    };
    groupNavEl.appendChild(btn);
  });
}

renderGroupNav();
renderSubNav();

<div class="tip">If something sounds wrong mid-service, the safe first move is almost always a fader or mute — not Gain or EQ. If a fix genuinely needs Gain/EQ, that's a sign to flag it to the engineer for after the service, not to start adjusting live unless you've been shown how.</div>

<div class="sl">If you're just running sound this Sunday</div>
<div class="card"><div class="card-title">You need 4 tabs, in this order</div>
<div class="card-body">1. <strong>Checklist</strong> — the actual step-by-step for turning the system on and getting through a service.<br>2. <strong>Gain staging</strong> — only if a musician sounds too quiet, too loud, or distorted and you need to fix it at the source.<br>3. <strong>Talkback</strong> — how to cue the band without the congregation hearing you.<br>4. Whichever <strong>IEM tab</strong> matches whoever's asking for a monitor change (Drummer / Bass / Keys 1 / Keys 2).<br>You don't need the Rack, Network, or EQ tabs to run a normal Sunday — those are for the person building or repairing the system.</div></div>

<div class="sl">If you're setting up, changing, or troubleshooting the system</div>
<div class="card"><div class="card-title">Read in tab order, top to bottom</div>
<div class="card-body">The tabs are deliberately sequenced: hardware and routing first (Overview → Talkback), then the foundational workflow (Gain staging → Send levels → Panning), then the deeper IEM build-out, then EQ. Gain staging is placed where it is because it genuinely needs to happen before EQ or compression touch anything — a clean signal first, always.</div></div>
<div class="tip"><strong>If you ever change a bus number or channel assignment:</strong> search this whole document for the old number before you consider the change finished. This document has been caught out by stale references more than once — a renumbering that only updates the "obvious" places leaves wrong information sitting in the Overview, checklists, and troubleshooting tables. A find-across-everything pass is the only real protection.</div>

<div class="sl">Glossary — the terms you'll hit constantly</div>
<table class="rt"><tr><th>Term</th><th>Plain-English meaning</th></tr>
<tr><td><strong>Channel</strong></td><td>One single input — one mic, one instrument. Channel 1, Channel 2, etc.</td></tr>
<tr><td><strong>Bus</strong></td><td>A shared "lane" that several channels can be mixed into together, so they can be controlled with one fader instead of many. E.g. all 6 backing vocal mics feed one "BV bus."</td></tr>
<tr><td><strong>AUX</strong></td><td>A separate set of 8 mini-buses, historically used for monitor mixes. This system doesn't use them for that anymore — see the IEM tabs for why.</td></tr>
<tr><td><strong>Matrix</strong></td><td>A special bus that feeds things outside the room — the lobby speakers and the livestream.</td></tr>
<tr><td><strong>Main LR</strong></td><td>The bus that feeds the room's main speakers — what the congregation hears.</td></tr>
<tr><td><strong>Send</strong></td><td>A copy of a channel or bus's signal, routed to somewhere else (another bus, Main, Matrix), at its own independent level.</td></tr>
<tr><td><strong>Gain</strong></td><td>How much a channel's incoming signal is boosted at the very start, before anything else — before EQ, before the fader, before sends. Found in the CHANNEL INPUT panel. Set once per mic, rarely touched again. Not the same as Trim, a separate smaller-range control — see the Gain staging tab.</td></tr>
<tr><td><strong>Fader</strong></td><td>The volume slider you actually move during a service, to balance the mix. Should stay near "unity" (0dB) when Gain is set correctly.</td></tr>
<tr><td><strong>PRE / POST</strong></td><td>Whether a send reads the signal before (PRE) or after (POST) a fader move. On WING this simple PRE/POST toggle only applies to bus-to-bus sends. Monitor sends should always be PRE, so pulling a fader for the room doesn't change what a musician hears.</td></tr>
<tr><td><strong>TAP / TAP POINT</strong></td><td>For an individual channel sending directly into a bus (not bus-to-bus), WING doesn't offer a simple PRE option — instead you choose TAP mode, which pulls from that channel's own movable TAP POINT (a position inside Gate→EQ→Comp→TAP POINT→Fader). Set TAP POINT after Comp for a monitor send, so it gets the fully processed sound without following that channel's fader.</td></tr>
<tr><td><strong>dBFS</strong></td><td>How "full" a digital signal is, measured backwards from 0 (maximum, where clipping starts) down to negative numbers. –18dBFS is quiet-ish and safe; 0dBFS is the ceiling.</td></tr>
<tr><td><strong>HPF (High-Pass Filter)</strong></td><td>Cuts everything below a chosen frequency. Used on almost every mic to remove rumble, handling noise, and stage vibration.</td></tr>
<tr><td><strong>Bell / PEQ</strong></td><td>An EQ move that boosts or cuts a specific narrow range of frequencies, shaped like a bell curve.</td></tr>
<tr><td><strong>Shelf</strong></td><td>An EQ move that boosts or cuts everything above (or below) a chosen frequency, not just a narrow range.</td></tr>
<tr><td><strong>Q</strong></td><td>How narrow or wide a bell EQ move is. Higher Q = narrower, more surgical. Lower Q = wider, more gentle.</td></tr>
<tr><td><strong>Knee</strong></td><td>On WING, a 1–5 number controlling how gradually a compressor kicks in. 1 = abrupt/hard, 5 = gradual/soft.</td></tr>
<tr><td><strong>DCA</strong></td><td>A fader that controls a whole group of channels at once (e.g. all backing vocals) without actually mixing them into a bus.</td></tr>
<tr><td><strong>MG (Mute Group)</strong></td><td>A button that mutes several channels at once — e.g. muting all wireless mics during a video segment.</td></tr>
<tr><td><strong>AES50</strong></td><td>The digital cable format connecting the WING console to the SD16 stagebox — carries many channels of audio over one cable.</td></tr>
<tr><td><strong>IEM</strong></td><td>In-Ear Monitor — the earpiece a musician wears to hear their own personal mix, instead of a stage speaker.</td></tr>
<tr><td><strong>Snap / Snapshot</strong></td><td>A saved copy of the entire console's settings, recallable in one tap. See the Scenes + Snaps tab.</td></tr>
<tr><td><strong>Snip / Snippet</strong></td><td>A saved copy of just a few specific settings you chose — smaller and more surgical than a Snap.</td></tr>
<tr><td><strong>Scope</strong></td><td>Controls which parts of the console actually change when a Snap is recalled — lets you reset the FOH mix without disturbing musicians' IEM mixes, for example.</td></tr>
</table>`;}

}

<div class="sl">Main LR processing — yes, it can be EQ'd and compressed, but think carefully before you do</div>
<div class="success">Confirmed from the console: Main LR (M1) has the same 8-band EQ as every bus (L, 1–6, H) — currently completely flat. That's correct, and it should stay that way until there's a specific reason to change it.</div>
<div class="card"><div class="card-title">EQ on Main LR — room correction only, not a shortcut</div>

<div class="card"><div class="card-title">Compression on Main LR — skip creative "glue," add a safety limiter instead</div>
<div class="card-body">Creative bus compression is a mixing choice with real trade-offs — done wrong it audibly pumps and sucks the life out of the mix, and it's not something this system needs. What <em>is</em> worth having: a protective limiter, same philosophy as every other limiter already in this system (IEM buses, room mics, Lead vocal channel) — sitting there doing nothing until something spikes, then catching it before it reaches the RCF speakers too hard.</div></div>

<tr><td>Attack</td><td>1ms</td><td>Fast enough to actually catch a transient spike before it passes through</td></tr>
<tr><td>Release</td><td>120ms</td><td>Quick enough to get out of the way, slow enough not to pump audibly</td></tr>
<tr><td>Hold</td><td>20ms</td><td>Keeps the gain reduction steady for a moment after the peak passes, instead of releasing immediately and re-triggering on the next low-frequency cycle — this is what actually stops audible pumping on bass-heavy content, more than release time alone</td></tr>

<div class="sl">The third piece — channel and bus faders</div>
<div class="danger"><strong>Gain, Send, and Fader are three different controls, and this document has only covered two of them until now.</strong> <strong>Gain</strong> is set once per mic, during gain staging, and rarely touched again. <strong>Send</strong> is how much of a source reaches a specific destination bus (an IEM mix, Matrix, a reverb) — fairly stable once dialed in, since musicians' comfort depends on it staying consistent. The <strong>Fader</strong> is different from both: it's the main, live control for how loud something sits in the actual room mix, and it's meant to move throughout a service as the engineer balances what's happening — a quiet spoken moment versus a full band crescendo. Unlike Gain, there's no single "correct" fader position to lock in. What follows are sensible starting points for a fresh mix, not fixed targets.</div>

<div class="danger"><strong>Full-mix headroom is a different problem from balance, and the numbers below account for both.</strong> A fader position that sounds right when only one or two things are playing can still add up to too much once everything hits at once — full band, drums, and every vocal together. That's summing, not a balance mistake, and it shows up as clipping on a bus, Main LR, or the stream even though every individual fader looked reasonable in isolation. The starting points below are pulled back specifically to leave headroom for those full-mix moments, not just for a quiet verse.</div>

<table class="rt"><tr><th>Channel / Bus</th><th>Starting fader</th><th>Note</th></tr>
<tr class="vox-r"><td>Lead vocal (IN1)</td><td><span class="lv u">0 dB (unity)</span></td><td>Single source, should stay the most prominent thing — don't pull this one back for headroom, fix headroom everywhere else instead</td></tr>
<tr class="vox-r"><td>B1–2 Backing vocals</td><td><span class="lv lo">–6 dB</span></td><td>Pulled back from –4dB — 6 voices summing into one bus needs real headroom, especially with full band underneath them</td></tr>
<tr class="vox-r"><td>Choir (IN8)</td><td><span class="lv lo">–4 dB</span></td><td>Slightly lower than before for the same full-mix reason, even though it's a single channel</td></tr>
<tr class="spch-r"><td>Pastor / B8 Speech</td><td><span class="lv u">0 dB (unity)</span></td><td>Single source, and rarely coincides with a full-band moment — no headroom pullback needed here</td></tr>
<tr class="band-r"><td>B3–4 Band (Keys + Bass)</td><td><span class="lv lo">–7 dB</span></td><td>Pulled back from –5dB — 4 sources feeding this bus, plus this is the bed under everything during full-mix moments</td></tr>
<tr class="drum-r"><td>B5–6 Drums</td><td><span class="lv lo">–6 dB</span></td><td>Pulled back from –4dB — 5 mics summing, and drums are usually exactly what's playing during the loudest moments</td></tr>
<tr class="horn-r"><td>B7 Horns</td><td><span class="lv lo">–7 dB</span></td><td>Pulled back from –5dB — 3 sources summing, occasional but loud when all three play together</td></tr>

</table>
<div class="tip"><strong>What "0dB / unity" actually means here:</strong> it's the reference mark on WING's fader scale — roughly ¾ of the way up physical fader travel — where the channel or bus passes through at neither boosted nor cut. Since Gain already did the real gain-staging work (see the Gain staging tab), unity is a genuinely sensible starting point for anything that should read as prominent — you're not fighting the fader to make up for a gain mistake, you're just balancing.</div>
<div class="danger"><strong>Confirmed still off: turn the Main LR limiter on.</strong> See the Limiters tab — 10:1, –3dBFS ceiling, 1ms attack. This is the actual safety net for the moment everything hits at once. Fader headroom reduces how often it needs to work; the limiter is what catches it the times it still happens anyway. Relying on faders alone, with no limiter live, means every full-band peak is a real risk, not just an occasional one.</div>

<div class="sl">Individual channel faders — balance within each bus</div>
<div class="tip">The table above covers the bus faders and the two channels that skip a bus entirely (Lead, Choir). It doesn't cover the individual mics <em>feeding</em> those buses — Kick vs Snare vs Overhead, or how the 6 backing vocalists sit relative to each other. That's a separate balance, set on each channel's own fader, and it's what actually shapes how each bus sounds internally before it ever reaches Main LR. Same full-mix headroom principle applies here too — every bus below has multiple simultaneous sources, so each one is pulled back slightly further than a pure balance judgement alone would suggest.</div>

function gainHTML(){return`
<div class="sl">What Gain actually is — the piece this document has used constantly without explaining</div>
<div class="danger"><strong>Gain is the very first control in the signal chain — before EQ, before Gate, before Compression, before the Fader touches anything.</strong> It sets how much the raw mic or line signal gets boosted right at the input stage, on WING's remote-controllable preamps. Everything downstream — EQ, dynamics, sends, the fader — is shaping a signal that Gain already decided the fundamental loudness of. Get Gain wrong and every control after it is compensating for that mistake instead of doing its actual job.</div>
<div class="tip"><strong>Where to find it on WING:</strong> select the channel → CHANNEL INPUT panel → the large fader-style Gain control, shown directly in dB with a wide range (0 to 60+ dB). Every target value in this tab — the 25–30dB for a wireless handheld, for example — refers to this control specifically.</div>
<div class="danger"><strong>Correction: Gain and Trim are two separate controls on WING, not the same thing.</strong> An earlier version of this tab said they were interchangeable — confirmed from the console that's wrong. <strong>Gain</strong> is the main input stage described above. <strong>Trim</strong> is a second, smaller-range control (±18dB) that sits in a "TRIM & BALANCE" panel alongside Balance, clearly meant for small fine adjustments rather than primary gain-staging. Do all real gain-staging work on <strong>Gain</strong>; leave <strong>Trim at 0.0</strong> unless there's a specific reason to nudge a channel slightly without touching the main input stage.</div>

<div class="danger"><strong>Do this before touching EQ or Compression on anything.</strong> Gain staging first, always — a clean, correctly-gained signal is what EQ and compression need to work on. Processing a badly-gained signal just makes the problem louder and harder to hear.</div>
<div class="success"><strong>Resolved:</strong> Lead vocal gain was sitting at 12.5dB, well under target — this has now been corrected up into the 25–30dB range below.</div>

<div class="sl">The flow — repeat for every channel below, in order</div>
<ul class="step-list">
<li><div class="sn">1</div><div class="at"><strong>Bypass EQ and Compression</strong> on this channel — take them out of circuit, don't just flatten them. You need to see and hear the raw signal.</div></li>
<li><div class="sn">2</div><div class="at">Pull the <strong>channel fader to unity (0dB)</strong>. From here on, Gain does the level-setting work — not the fader.</div></li>
<li><div class="sn">3</div><div class="at">Have the performer play/sing/speak at <strong>real performance volume</strong> — not a quiet soundcheck mumble. Gain staged against a quiet voice is exactly how a channel ends up under-gained.</div></li>
<li><div class="sn">4</div><div class="at">Adjust <strong>WING Gain</strong> (CHANNEL INPUT panel, not the smaller Trim control) until the meter sits inside the target range in the table below, for this specific channel.</div></li>
<li><div class="sn">5</div><div class="at">Confirm the loudest peaks — the hardest hit, the loudest note — never approach 0dBFS.</div></li>
<li><div class="sn">6</div><div class="at">Check this channel's send levels (to its bus, Main LR, or Matrix) aren't independently boosted to compensate for a gain problem you should be fixing at Gain instead.</div></li>
<li><div class="sn">7</div><div class="at"><strong>Tick the box, move to the next channel in the list below.</strong> Don't skip ahead — a channel out of order is a channel that gets forgotten.</div></li>
<li><div class="sn">8</div><div class="at">Only once <strong>every single channel</strong> below is ticked off: re-engage EQ and Compression across the board, and reintroduce fader balance for the mix.</div></li>
</ul>

<div class="tip"><strong>About the Matrix specifically:</strong> even with every channel individually gain-staged correctly, Matrix is a summing point — Lead vocal, BVs, Band, Drums, Horns, Speech, and the reverb return all land there together. Leave headroom on the Matrix bus itself rather than running every single send in hot. If Matrix still clips after every channel below is properly gained, the fix is pulling back the Matrix bus's own master level — not re-boosting an individual channel's send to compensate.</div>

function scenesHTML(){return`
<div class="sl">Snap, Snip, Show — what each one actually does</div>
<table class="rt"><tr><th>Tool</th><th>What it saves</th><th>Use it for</th></tr>
<tr><td><strong>Snap (Snapshot)</strong></td><td>The entire console — every fader, EQ, route</td><td>Full scene changes: Welcome → Worship → Message → Closing</td></tr>
<tr><td><strong>Snip (Snippet)</strong></td><td>Only the specific parameters you choose</td><td>Surgical changes — swap which vocalist is on Lead, restore one channel's dynamics</td></tr>
<tr><td><strong>Show</strong></td><td>An ordered sequence of Snaps/Snips</td><td>A full scripted service you can step through in order</td></tr>
</table>

<div class="danger"><strong>The one setting that matters most for this system: Scope.</strong> Every Snap has a Scope — which parts of the console it's actually allowed to change when recalled. If you build Snaps for FOH scene changes without excluding the IEM buses (B9, B10, B11–12, B13) from their Scope, recalling a scene mid-service will yank every musician's monitor mix out from under them. Exclude buses B9–13 and their sends from every FOH-focused Snap's Scope — musicians' IEM mixes should only ever change when someone deliberately goes to that IEM tab and adjusts it, never as a side effect of an FOH scene recall.</div>

<div class="sl">The Snap list — built on DCA mutes, not individual channels</div>
<div class="success">The fast, low-risk way to build these: control each section with its <strong>DCA mute</strong>, not by muting 40 channels individually. Bring a whole section in or out with one button. This table is your build reference — the exact DCA state for each Snap.</div>

<div class="sl">Building each Snap on WING — step by step</div>
<ul class="step-list">
<li><div class="sn">1</div><div class="at">Get the console into the <strong>01_Startup_Baseline</strong> state first: every DCA muted, every channel gain-staged and routed correctly per the earlier tabs, all 4 IEM buses live and configured, Global Safes already set (see below)</div></li>

<li><div class="sn">5</div><div class="at">Repeat for 03 through 06 — set the DCA mute states from the table, SAVE each as a new Snap, working from the baseline each time rather than editing forward from the previous Snap, so mistakes don't carry through</div></li>
<li><div class="sn">6</div><div class="at">For Snaps 02–06: before saving each one, open its <strong>Scope</strong> settings and exclude B9, B10, B11, B12, and B13 (all 4 IEM buses and their sends) — this is the step that's easy to forget and the one that matters most, see the warning above</div></li>
<li><div class="sn">7</div><div class="at">Assign WING user button 6 to step through this Snap list in order (already noted on the Not Considered tab) so you can advance through the service with one tap</div></li>
</ul>
<div class="tip">Name Snaps with a number prefix (01_, 02_...) so they always sort in service order in the library, not alphabetically. Use <strong>Save</strong> to create a new Snap, <strong>Update</strong> to modify an existing one within its own Scope — Update won't accidentally widen what a Snap touches.</div>

<div class="sl">Global Safes — protect what should never change on any scene recall</div>
<div class="success">Scope controls one Snap at a time. <strong>Global Safes</strong> is a second, separate layer that protects a parameter from every Snap, permanently, regardless of that Snap's own Scope. Set these once and forget them:</div>
<table class="rt">
<tr><th>Protect</th><th>Why</th></tr>
<tr><td>Pastor lapel (IN9) gain</td><td>Gain-staged once and rarely re-touched — shouldn't drift on a scene change</td></tr>
<tr><td>Lead vocal (IN1) channel limiter</td><td>Safety-critical — should never be accidentally disabled by a Snap recall</td></tr>
<tr><td>All 4 IEM bus limiters (B9/10/11–12/13)</td><td>Hearing safety for musicians — never optional, on any scene</td></tr>
<tr><td>Room mic limiters (IN35–36)</td><td>Same reasoning — protects against a stray Snap re-enabling something unsafe</td></tr>
</table>

<div class="sl">Two habits that prevent the most common problems</div>
<div class="card"><div class="card-title">Always use Shutdown, not just the power switch</div>
<div class="card-body">WING has a Shutdown option in the SETUP menu that properly saves the current state before power-off. Skipping it and just flipping the switch means the console reverts to the last saved state on next boot — which could be considerably different from how you left the mix. Build the habit: SETUP → Shutdown, every time.</div></div>
<div class="card"><div class="card-title">Use Snips for the changes that happen every week</div>
<div class="card-body">If the same small change happens most weeks — a different vocalist leading, a guest speaker instead of Pastor on the Speech bus — build a Snip for it once instead of manually re-patching each time. A Snip only touches what you explicitly recorded, so it's safe to recall without worrying about side effects elsewhere.</div></div>

<div class="sl">Other WING features worth knowing about</div>
<table class="rt"><tr><th>Feature</th><th>What it does</th></tr>
<tr><td><strong>Channel Auto Select</strong></td><td>Touching a fader automatically selects that channel for editing — speeds up live mixing, worth turning on</td></tr>
<tr><td><strong>Custom Layers</strong></td><td>Build a "Worship" fader layout showing just band+vocals, and a separate "Message" layout showing just Speech — instead of hunting through 40 channels every time</td></tr>
<tr><td><strong>User-Defined Keys</strong></td><td>Already partly planned — see the Not considered tab for the recommended Btn 1–6 assignment, including Btn 6 for scene recall</td></tr>
<tr><td><strong>USB backup</strong></td><td>Copy every Snap/Snip/Show to a USB drive — the console can also appear as a drive on a computer for full backup</td></tr>
</table>`;}

<div class="success"><strong>The good news: nothing extra to buy.</strong> WING streams up to 48 channels over the same USB-B cable already connected for your stream — a full multitrack recording and the existing 2-channel stream output can run simultaneously, no extra hardware, no second connection.</div>

<div class="sl">The one decision that matters most: Sources, not Channels</div>
<div class="danger"><strong>Route raw Sources to USB, not processed Channels.</strong> WING can send either the dry, unprocessed signal straight off each preamp ("Source"), or the fully processed signal after your live EQ/comp/gate ("Channel"). Sources give you a clean multitrack recording you can remix properly later, unlocked from whatever EQ/comp decisions you make live. Channels bake today's live decisions in permanently. Sources are also technically easier: processed Channel taps have to go through a separate patch limited to 24 mono signals total — with ~30 active inputs, that's a real ceiling you'd hit. Sources bypass that limit entirely.</div>

<div class="sl">Setup — WING side, do this first regardless of which DAW you use</div>
<ul class="step-list">
<li><div class="sn">1</div><div class="at">SETUP → USB/Card Config → set channel count to <strong>48</strong></div></li>
<li><div class="sn">2</div><div class="at">Confirm the <strong>sample rate matches</strong> between WING and your DAW — 44.1kHz or 48kHz only, no conversion happens automatically. 48kHz is the standard choice if you're also streaming.</div></li>

<div class="sl">🍎 Logic Pro — your primary path</div>
<div class="tip">You already own it, it's more than capable for a 30-track "arm and record" session, and there's no reason to also buy or learn Reaper unless you specifically want a cross-platform backup — see below.</div>
<ul class="step-list">
<li><div class="sn">1</div><div class="at">Logic Pro → <strong>Settings → Audio → Devices</strong> → set both Output Device and Input Device to <strong>WING</strong></div></li>
<li><div class="sn">2</div><div class="at">Same screen → confirm I/O Buffer Size (256–512 samples is fine for recording-only, doesn't need to be ultra-low since you're not monitoring live through it)</div></li>
<li><div class="sn">3</div><div class="at">File → New → Empty Project → when prompted, set <strong>Project Sample Rate</strong> to match WING exactly (48kHz)</div></li>
<li><div class="sn">4</div><div class="at">Track → New Tracks → Audio → set <strong>Number of tracks: 30</strong>, Format: <strong>Mono</strong> → Create</div></li>
<li><div class="sn">5</div><div class="at">For each track: click its input selector on the channel strip → choose <strong>Input 3</strong> through <strong>Input 32</strong> in order, matching the recording map above</div></li>
<li><div class="sn">6</div><div class="at">Rename each track to match its source (Leader, Vocal 1, Kick, etc.) — double-click the track name</div></li>
<li><div class="sn">7</div><div class="at">Select all 30 tracks → press <strong>R</strong> to record-enable all of them at once</div></li>
<li><div class="sn">8</div><div class="at">File → <strong>Save as Template</strong> — every future recording is then just "open template → hit record," no rebuilding</div></li>
</ul>

<div class="sl">🎛️ Reaper — cross-platform fallback</div>
<div class="tip">Worth keeping as a backup specifically if there's any chance someone other than you needs to run a recording — Reaper's famously easy to strip down to "one big record button" for a volunteer, and it runs on Windows too if the Mac isn't available. ~£50 for a church/nonprofit licence.</div>
<ul class="step-list">
<li><div class="sn">1</div><div class="at">Reaper → <strong>Preferences → Device</strong> → Audio System: Core Audio → set both input and output device to <strong>WING</strong></div></li>
<li><div class="sn">2</div><div class="at">Same screen → set sample rate to match WING exactly (48kHz)</div></li>
<li><div class="sn">3</div><div class="at">Track menu → <strong>Insert Multiple New Tracks</strong> → enter <strong>30</strong></div></li>
<li><div class="sn">4</div><div class="at">For each track: click the small input button on the track control panel → select <strong>Mono → Input 3</strong> through <strong>Input 32</strong> in order, matching the recording map above</div></li>
<li><div class="sn">5</div><div class="at">Rename each track to match its source — double-click the track name field</div></li>
<li><div class="sn">6</div><div class="at">Select all tracks → click any record-arm button while holding <strong>Ctrl</strong> to arm all simultaneously (or Track → Record arm → all tracks)</div></li>
<li><div class="sn">7</div><div class="at">File → <strong>Save Project As Template</strong> — same reusability benefit as the Logic template</div></li>
</ul>

<div class="sl">Bonus: virtual soundcheck</div>
<div class="tip">Once you have even one full multitrack recording, WING can play it back as an <strong>Alt source</strong> in place of the live inputs — letting you (or an arriving band) soundcheck against a real recording without anyone needing to be in the room. Genuinely useful for tuning monitor mixes or testing a system change without pulling musicians in early.</div>

<div class="sl">Reliability tip</div>
<div class="tip">USB drives fail at the worst possible time. If you want a safety net beyond the DAW recording itself, some WING users run a second, independent recording in parallel — but that needs the separate WING Live SD-card expansion card, which isn't part of this system. Not necessary to start; worth knowing the option exists once recording becomes something you rely on regularly.</div>`;}

<div class="sl">Where else this could genuinely help — a Choir reverb, as an example build</div>
<div class="card"><div class="card-title">Why Choir shouldn't just share FX1</div>
<div class="card-body">Hall reverb is tuned for Lead vocal and BVs — worship-style, lush and sustained. Choir usually wants something different: a touch of room ambience for cohesion, not the same wash. Rather than send Choir into the existing Hall reverb at a compromise level, build it its own send using one of the 2 genuine spare buses (B14 or B15) and a second FX slot (FX2).</div></div>

<div class="sl">How to build it — step by step</div>
<ul class="step-list">
<li><div class="sn">1</div><div class="at">Pick one spare bus for this — <strong>B14</strong> — and rename it "Choir Reverb Send"</div></li>
<li><div class="sn">2</div><div class="at">Select <strong>Choir (IN8)</strong> → send/assign directly to B14 at around –6dB to start (Choir has no bus of its own, so this is a normal channel→bus send, same pattern as Click and TALK A/B)</div></li>
<li><div class="sn">3</div><div class="at">HOME → <strong>EFFECTS</strong> → select an empty slot, <strong>FX2</strong> → choose <strong>Room Reverb</strong> (or Plate, if Choir needs more presence than ambience)</div></li>
<li><div class="sn">4</div><div class="at">On bus B14 → <strong>INS</strong> (insert) → assign FX2 → set FX2's mix to <strong>100% wet</strong> (the dry signal already exists via Choir's direct send to Main LR — B14 only needs to contribute the reverb tail)</div></li>
<li><div class="sn">5</div><div class="at">Dial in FX2's <strong>Pre-delay</strong> (time before the reverb starts — keeps early consonants clear), <strong>Size</strong> (simulated room size), and <strong>Decay</strong> (how long it lingers) to taste for your room's acoustics</div></li>
<li><div class="sn">6</div><div class="at">Route B14's output → Main LR (and Matrix if you want it on the stream too), at a conservative level — reverb is easy to overdo, start quiet and add, not the other way round</div></li>
<li><div class="sn">7</div><div class="at">This uses your <strong>last-but-one spare bus</strong> — B15 remains genuinely free after this</div></li>
</ul>
<div class="danger"><strong>Don't send Choir into B14 AND leave it also hitting FX1's Hall reverb by accident.</strong> Choir should only ever reach one reverb character at a time — double-check IN8 has no stray send into B16 before calling this done.</div>

<div class="sl">Practical recipes — actually using these to improve the live mix</div>

<div class="card"><div class="card-title">Recipe 1: De-esser on Lead vocal — fixing a problem the EQ created</div>
<div class="card-body">Lead vocal's EQ already carries a +3dB presence boost around 3–3.5kHz to help it cut through the mix — but that's almost exactly the range where harsh "s" and "sh" sounds live. A wireless handheld plus that boost is a common recipe for sibilance that wasn't a problem before the presence boost was added. A de-esser fixes this without undoing the boost that's helping the vocal read clearly.</div></div>
<ul class="step-list">
<li><div class="sn">1</div><div class="at">HOME → <strong>EFFECTS</strong> → empty slot → select <strong>2-Band De-esser</strong> (Standard, works in any slot)</div></li>
<li><div class="sn">2</div><div class="at">On Lead vocal (IN1) → <strong>INS</strong> → assign this FX slot as an insert, not a send — de-essing has to react to this channel's own dynamics in real time</div></li>
<li><div class="sn">3</div><div class="at">Set the de-esser's target frequency around <strong>5–8kHz</strong> to start — sweep it while the vocalist says a few "s"-heavy words, and tune to where it sounds harshest</div></li>
<li><div class="sn">4</div><div class="at">Set threshold so it only engages on genuine harsh esses, not every high-frequency sound — same "invisible until needed" principle as the limiters already documented</div></li>
<li><div class="sn">5</div><div class="at">Moderate reduction amount — a de-esser that's too aggressive makes a voice sound lispy or dull, which is worse than the sibilance it's fixing</div></li>
</ul>

<div class="card"><div class="card-title">Recipe 2: Same de-esser, second application — Pastor lapel</div>
<div class="card-body">Lapel mics sit close to the mouth and chest, and speech EQ tends to favor presence for clarity — both push toward sibilance. Same tool, same reasoning as Lead vocal, just a second insert on IN9.</div></div>

<div class="card"><div class="card-title">Recipe 3: Graphic EQ on Main LR — an actual workflow, not just "if needed"</div>
<div class="card-body">The Main LR processing section already says EQ there should be room-correction only. Here's how you'd actually find something worth correcting: during a genuinely loud, full-mix moment — not a quiet verse — listen critically for anything that sounds boomy, boxy, or harsh that isn't coming from any one instrument. That's usually the room, not the mix. Insert Graphic EQ on Main LR, find that frequency by ear (a boomy low-mid resonance is common in smaller rooms, often somewhere in 150–300Hz), and pull it down a few dB with a narrow band. Cut, don't boost — boosting on a room-correction EQ usually just excites the next problem instead of fixing this one. If nothing sounds wrong, leave it flat — most rooms don't need this at all.</div></div>

<div class="card"><div class="card-title">Recipe 4: Rotary Speaker on Keys — creative, not permanent</div>
<div class="card-body">This is a different category from the recipes above — not fixing a problem, adding a texture for a specific song. Insert on Keys 1 (or Keys 2), but leave the insert switched off by default. Engage it only for the specific song that calls for that classic swirling organ/Leslie sound, then switch it back off — it shouldn't be quietly coloring every other song's keys part.</div></div>

<div class="tip"><strong>One more worth knowing about: Speaker Manager, for the RCF ART 312-A specifically.</strong> This looks like it could provide crossover/EQ/limiting tuned to your actual speaker model, which is a genuinely different job from the general Main LR safety limiter already documented — that one protects against any spike, this would be about getting the correct frequency response and protection curve for these specific speakers. Worth checking if RCF publishes official presets or specs for the ART 312-A before setting this up by ear — speaker-specific protection curves are the kind of thing worth getting from the manufacturer rather than guessing.</div>`;}
