<div class="danger"><strong>A limiter is not a compressor turned up.</strong> They use the same mechanism, but the job is completely different. A compressor shapes tone continuously — you can hear it working, that's the point. A limiter is a safety net — it should be doing nothing at all until something spikes, and then it clamps hard and gets out of the way. If you can hear a limiter working during normal levels, the threshold is wrong.</div>

<div class="success"><strong>Important: WING doesn't have a separate "Limiter" control.</strong> There's no dedicated limiter button or menu anywhere on the console — <strong>COMP is the only dynamics control on a channel or bus</strong>, for both jobs. Setting COMP with limiter-style values (high ratio, fast attack, tight threshold) <em>is</em> setting a limiter. Every limiter mentioned anywhere in this document — Main LR, Lead vocal, every IEM bus, Room mics — is a COMP setting, not a separate feature.</div>

<div class="sl">The parameters, specifically for limiting</div>
<table class="rt"><tr><th>Parameter</th><th>For a limiter specifically</th><th>Why</th></tr>
<tr><td><strong>Threshold / Ceiling</strong></td><td>Close to the actual danger point, not general loudness</td><td>It should only ever engage on a genuine spike — a fader mistake, a dropped mic, a sudden shout — not on normal loud singing or playing</td></tr>
<tr><td><strong>Ratio</strong></td><td>High — 10:1 or more</td><td>A limiter clamps hard once triggered. A gentle ratio here is just a compressor with extra steps — it won't actually protect anything</td></tr>
<tr><td><strong>Attack</strong></td><td>Fast — around 1ms</td><td>Has to catch the spike before it passes through, not after</td></tr>
<tr><td><strong>Hold</strong></td><td>Short but present — 15–20ms</td><td>Keeps the gain reduction steady for a moment after the peak, so it doesn't release and immediately re-trigger on the next cycle of a low note (audible chatter/pumping)</td></tr>
<tr><td><strong>Release</strong></td><td>Quick enough to get out of the way — 100–150ms</td><td>Should return to normal fast so it's not still holding gain down when the next legitimate loud moment happens</td></tr>
</table>

<div class="sl">Every limiter in this system, in one place</div>
<table class="rt"><tr><th>Location</th><th>Ceiling</th><th>Ratio</th><th>Protects</th></tr>
<tr class="room-r"><td>Room mic L + R</td><td>–6dBFS</td><td>10:1</td><td>Against a stray loud sound near an open room mic — no gate, so this is the only safety net they have</td></tr>
<tr class="drum-r"><td>B9 Drummer IEM</td><td>–6dBFS</td><td>—</td><td>Musicians' ears — in-ears sit in the ear canal, this is non-negotiable on every IEM bus</td></tr>
<tr class="drum-r"><td>B10 Bass IEM</td><td>–6dBFS</td><td>—</td><td>Same reasoning, every IEM bus without exception</td></tr>
<tr class="drum-r"><td>B11–12 Keys 1 IEM</td><td>–6dBFS</td><td>—</td><td>Same reasoning, applies to both L and R once stereo-linked</td></tr>
<tr class="drum-r"><td>B13 Keys 2 IEM</td><td>–6dBFS</td><td>—</td><td>Same reasoning</td></tr>
<tr class="vox-r"><td>Lead vocal channel (IN1)</td><td>–6dBFS</td><td>—</td><td>Sits before Main LR, Matrix, and all 4 IEM sends split off — one setting protects everything downstream from a single vocal spike, rather than relying on 4+ separate bus limiters reacting independently</td></tr>
<tr style="background:rgba(146,64,14,0.05)"><td>Main LR</td><td>–3dBFS</td><td>10:1</td><td>The room and the RCF speakers — last line of defense before the signal leaves the console entirely, sits higher than the others since everything feeding it should already be well gain-staged</td></tr>
</table>
<div class="tip">Notice the pattern: everything upstream (room mics, IEM buses, Lead vocal) sits at <strong>–6dBFS</strong>, giving generous headroom since spikes can come from many independent sources. Main LR sits higher at <strong>–3dBFS</strong> specifically because by the time signal reaches it, gain staging and all the upstream limiters have already done most of the protective work — it's a true last-resort catch, not a primary one.</div>
<div class="success"><strong>There's actually a genuine fifth layer beyond this table: the RCF speakers themselves have their own built-in limiter, confirmed in RCF's own manual.</strong> This isn't a WING setting at all — it's hardware-level protection inside the ART 312-A, catching things even a correctly-configured Main LR limiter wouldn't (like an amplifier running hot). See the RCF Speakers tab for the full detail.</div>

<div class="sl">Two worked examples — exact steps, on the actual console</div>
<div class="card"><div class="card-title">Main LR — currently off, still needs doing</div>
<div class="card-body">
1. Select <strong>Main LR (M1)</strong><br>
2. Open <strong>COMP</strong><br>
3. Turn it ON<br>
4. <strong>Ratio → 10:1</strong><br>
5. <strong>Threshold → –3dBFS</strong><br>
6. <strong>Attack → 1ms</strong><br>
7. <strong>Hold → 15–20ms</strong><br>
8. <strong>Release → 100–150ms</strong><br>
That's the whole limiter — there's no extra step, no separate screen. COMP with these 5 values set is the Main LR limiter.
</div></div>
<div class="card"><div class="card-title">Lead vocal (IN1) — already set, shown here as the same pattern</div>
<div class="card-body">
1. Select <strong>Lead vocal (IN1)</strong><br>
2. Open <strong>COMP</strong><br>
3. Turn it ON<br>
4. <strong>Ratio → high (10:1+)</strong><br>
5. <strong>Threshold → –6dBFS</strong><br>
6. <strong>Attack → fast (~1ms)</strong><br>
7. <strong>Hold / Release → same short-hold, quick-release shape as the table above</strong><br>
Exactly the same control, same screen, same idea as Main LR — just a different threshold because it's protecting a single source further upstream, not the whole final mix.
</div></div>

<div class="sl">How to actually set one up on WING</div>
<ul class="step-list">
<li><div class="sn">1</div><div class="at">Select the channel or bus → <strong>COMP</strong> (left sidebar on the channel/bus screen) — this is the only dynamics control there is, for both compression and limiting</div></li>
<li><div class="sn">2</div><div class="at">Turn it ON, then set <strong>Ratio</strong> high (10:1+) — this is what actually makes it behave like a limiter rather than a compressor</div></li>
<li><div class="sn">3</div><div class="at">Set <strong>Threshold</strong> close to the real danger point for that specific signal — this varies by source, see the table above for this system's actual values</div></li>
<li><div class="sn">4</div><div class="at">Set <strong>Attack</strong> fast (~1ms), <strong>Hold</strong> short (15–20ms), <strong>Release</strong> quick (100–150ms)</div></li>
<li><div class="sn">5</div><div class="at">Test it: play back something at normal performance level and confirm the gain reduction meter barely moves. Only a genuine spike should show real reduction — if it's active during normal singing/playing, the threshold needs to come up (less aggressive), not down</div></li>
</ul>`;}

<div class="tip"><strong>128dB max SPL is a genuinely useful reference for the congregation SPL exposure item</strong> already flagged on the Not Considered tab — that's the speaker's absolute ceiling, nowhere near where a service should actually run. The ~94–96dB target mentioned there has a large margin below this number, which is exactly how it should be.</div>

<div class="sl">Rear panel controls — confirm these are set correctly</div>
<table class="rt"><tr><th>Control</th><th>What it does</th><th>Correct setting for this system</th></tr>
<tr><td><strong>INPUT SENSITIVITY switch</strong></td><td>LINE (0dB) vs MIC — tells the speaker's own preamp what level to expect</td><td><strong>LINE</strong> — WING's Main LR output is a line-level signal, not a raw mic</td></tr>
<tr><td><strong>FLAT/BOOST switch</strong></td><td>Boost adds a loudness curve, meant specifically for background music played at low volume. Flat is RCF's own recommendation for every other use.</td><td><strong>FLAT</strong> — this is a live service, not background music at low level</td></tr>
<tr><td><strong>VOLUME control</strong></td><td>The speaker's own amplifier gain — separate from anything on WING</td><td>Set once during initial setup, then leave alone — mixing happens at WING, not by touching this per song</td></tr>
<tr><td><strong>LIMITER LED</strong></td><td>Lights red when the speaker's own built-in limiter engages</td><td>Occasional blinking is fine. Frequent blinking or staying lit means the signal feeding it is too hot — turn down before the room hears distortion</td></tr>
<tr><td><strong>SIGNAL LED</strong></td><td>Lights green when audio is present at the input</td><td>Should be lit and moving with the music during a service — dark means no signal is reaching this speaker at all</td></tr>
</table>

<div class="danger"><strong>Important discovery: there are two separate limiters between the console and the room, not one.</strong> The Main LR limiter already documented in the Limiters tab (10:1, –3dBFS, set on WING) is the first layer. This RCF speaker has its <strong>own built-in limiter</strong> too — confirmed in the spec as "Soft limiter" and "RMS limiter" — which protects the actual driver and amplifier from being overdriven, independently of anything WING does. Two real layers of protection, not a duplicate of the same thing: WING's limiter protects the mix and prevents digital clipping before the signal leaves the console; the speaker's own limiter protects the physical hardware itself, catching things even WING's limiter wouldn't know about (like an amplifier running hot).</div>

<div class="sl">Power-on / power-off order — matters more than it looks</div>
<div class="danger"><strong>Speakers on last, off first — every time, no exceptions.</strong> Straight from RCF's own manual: before powering the speakers on, the console must already be on and its output at minimum. Turn the speakers on only after everything upstream is live, and turn them off immediately after the service, before anything else. Getting this backwards risks a loud "bump" through the speakers as other gear powers up or down — annoying at best, damaging to the driver at worst.</div>

<div class="sl">If the LIMITER LED is flashing — what it actually means</div>
<table class="rt"><tr><th>Flash pattern</th><th>Meaning</th><th>What to do</th></tr>
<tr><td>1–2 flashes</td><td><strong>Warning</strong> — minor, self-recovering issue</td><td>Performance isn't affected. Worth noting if it keeps happening, not an emergency</td></tr>
<tr><td>3–4 flashes</td><td><strong>Limitation</strong> — an error was detected, output reduced by 3dB automatically</td><td>Still working, but flag it for a service centre check after the service — don't ignore repeatedly</td></tr>
<tr><td>5–8 flashes</td><td><strong>Failure</strong> — serious fault, speaker mutes itself</td><td>Check power connection and correct voltage, confirm it isn't overheated, power-cycle with a few minutes off. Still flashing after that → contact an authorised RCF service centre</td></tr>
</table>

<div class="sl">Physical handling — worth knowing before anyone moves these</div>
<div class="danger"><strong>Never suspend these by the handles.</strong> RCF is explicit about this — handles are for carrying only. Rigging requires the dedicated M10 threaded inserts (at least 2, on opposite sides) with proper approved hardware, not the handles.</div>
